<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Payday</title>
  <!-- Nimiq-style hexagon: the network you earn from -->
  <polygon points="6,32 19,9.5 45,9.5 58,32 45,54.5 19,54.5" fill="#1f2348" stroke="#1f2348" stroke-width="8" stroke-linejoin="round"/>
  <!-- the sun rising: the "day" in Payday, your NIM coming up -->
  <path d="M20.5 39a11.5 11.5 0 0 1 23 0z" fill="#e9b213"/>
  <!-- three rays: payouts on a rhythm -->
  <g stroke="#e9b213" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M32 22.5v-5"/>
    <path d="M43.7 27.3l3.5-3.5"/>
    <path d="M20.3 27.3l-3.5-3.5"/>
    <!-- the horizon, and a payslip line beneath it -->
    <path d="M14.5 39h35"/>
    <path d="M26.5 46.5h11" stroke-width="3"/>
  </g>
</svg>
